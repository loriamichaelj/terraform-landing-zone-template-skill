# Checks the markdown: relative links and anchors, and that the ADR index matches the ADRs.
# Reproduce locally: python tools/check_docs.py
name: "CI: Docs"
run-name: "Docs (${{ github.event_name }})"

on:
  # No path filter on pull requests, so this can become a required status check.
  pull_request:
  push:
    branches: [dev]
    paths:
      - "**.md"
      - tools/check_docs.py
      - .github/workflows/ci-docs.yml

permissions: {}

concurrency:
  group: ci-docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check links and ADR index
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Check the markdown
        run: python tools/check_docs.py
